name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Determine release tag
        shell: pwsh
        run: |
          $refName = '${{ github.ref_name }}'
          $tag = if ($refName.StartsWith('release/')) { $refName.Substring(8) } else { $refName }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.].+)?$') {
            throw "Invalid release tag: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore SMT.NQOL.csproj

      - name: Build
        run: dotnet build SMT.NQOL.csproj -c Release --no-restore

      - name: Regression - pricing
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/pricing.ps1

      - name: Regression - hot paths
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/optimization.ps1

      - name: Regression - core behavior
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/verify.ps1

      - name: Regression - reconnect
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/reconnect.ps1

      - name: Regression - game context
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/context.ps1

      - name: Regression - live shelf selection
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/shelf-live.ps1

      - name: Regression - checkout colliders
        shell: pwsh
        run: pwsh -NoProfile -File ./src/Tests/colliders.ps1

      - name: Package release
        shell: pwsh
        run: |
          $packageName = "SMT.NQOL-$env:RELEASE_TAG"
          $staging = Join-Path 'dist' $packageName
          $zip = Join-Path 'dist' "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'bin/Release/netstandard2.1/SMT.NQOL.dll' $staging
          Copy-Item 'README.md' $staging
          Copy-Item 'LICENSE' $staging
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: SMT.NQOL-${{ env.RELEASE_TAG }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: SMT NQOL ${{ env.RELEASE_TAG }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove temporary release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        continue-on-error: true
        shell: pwsh
        run: git push origin --delete "${{ github.ref_name }}"
